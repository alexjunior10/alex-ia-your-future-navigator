<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <!-- Gradients for realistic 3D isometric shading -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Highlighted Active Faces for Front Projection -->
    <linearGradient id="frontHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.15" flood-color="#0F172A"/>
    </filter>

    <marker id="arrowHead" markerWidth="6" markerHeight="6" refX="4" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6366F1" />
    </marker>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: 700; fill: #1E293B; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 500; fill: #64748B; }
    .opt-label { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #0F172A; }
    .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #4F46E5; }
    .arrow-initial { fill: #4F46E5; filter: drop-shadow(0 2px 3px rgba(79,70,229,0.3)); }
    .arrow-opt { fill: #2563EB; }
  </style>

  <!-- Background container -->
  <rect width="850" height="480" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Header Section -->
  <rect x="30" y="24" width="130" height="24" rx="12" fill="#EEF2FF"/>
  <text x="95" y="40" text-anchor="middle" class="badge">MINI-RETO Q33</text>
  <text x="30" y="75" class="title">Reto Espacial: Rotación de Cubo en 90°</text>
  <text x="30" y="96" class="subtitle">Observa la posición inicial. Si el cubo gira 90° hacia la derecha en la dirección indicada, ¿qué orientación tiene la flecha?</text>

  <!-- ==================== ESTADO INICIAL (PANEL IZQUIERDO) ==================== -->
  <g transform="translate(40, 120)">
    <rect width="250" height="320" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)"/>
    <rect x="20" y="16" width="90" height="22" rx="11" fill="#E0F2FE"/>
    <text x="65" y="31" text-anchor="middle" style="font-family: sans-serif; font-size: 11px; font-weight: 700; fill: #0369A1;">ESTADO INICIAL</text>
    
    <!-- 3D Cube (Orthographic / Isometric View) -->
    <!-- Center coordinate for cube: (125, 160) -->
    <g transform="translate(125, 160)">
      <!-- Top Face -->
      <polygon points="0,-60 52,-30 0,0 -52,-30" fill="url(#topFace)" stroke="#94A3B8" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- Left Face -->
      <polygon points="-52,-30 0,0 0,60 -52,30" fill="url(#leftFace)" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- Right/Front Face (Highlighted with Arrow) -->
      <polygon points="0,0 52,-30 52,30 0,60" fill="url(#frontHighlight)" stroke="#94A3B8" stroke-width="1.5" stroke-linejoin="round"/>
      
      <!-- Arrow on Front/Right Face (Pointing UP-RIGHT along vertical axis of face) -->
      <!-- Skewed/transformed arrow in isometric projection -->
      <g transform="translate(26, 15) skewY(-30) scale(0.9)">
        <!-- Vertical arrow pointing UP on the face -->
        <path d="M 0,-24 L 10,-8 L 4,-8 L 4,20 L -4,20 L -4,-8 L -10,-8 Z" fill="#4F46E5" stroke="#3730A3" stroke-width="1"/>
      </g>
    </g>

    <!-- Curved Rotation Action Arrow -->
    <path d="M 125, 235 A 45 45 0 0 0 175, 220" fill="none" stroke="#6366F1" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowHead)"/>
    <text x="125" y="275" text-anchor="middle" style="font-family: sans-serif; font-size: 13px; font-weight: 700; fill: #4F46E5;">Giro 90° a la derecha</text>
    <text x="125" y="295" text-anchor="middle" class="subtitle">Sentido horario (↻)</text>
  </g>

  <!-- ==================== OPCIONES A, B, C, D (PANEL DERECHO) ==================== -->
  <g transform="translate(315, 120)">
    <rect width="495" height="320" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" filter="url(#shadow)"/>
    
    <!-- Option A -->
    <g transform="translate(20, 20)">
      <rect width="220" height="130" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
      <circle cx="28" cy="28" r="14" fill="#E2E8F0"/>
      <text x="28" y="33" text-anchor="middle" class="opt-label">A</text>
      <!-- Cube with arrow pointing UP (No rotation) -->
      <g transform="translate(130, 65) scale(0.68)">
        <polygon points="0,-50 44,-25 0,0 -44,-25" fill="url(#topFace)" stroke="#94A3B8" stroke-width="1.5"/>
        <polygon points="-44,-25 0,0 0,50 -44,25" fill="url(#leftFace)" stroke="#64748B" stroke-width="1.5"/>
        <polygon points="0,0 44,-25 44,25 0,50" fill="url(#frontHighlight)" stroke="#94A3B8" stroke-width="1.5"/>
        <!-- Arrow pointing UP -->
        <g transform="translate(22, 12) skewY(-30) scale(0.8)">
          <path d="M 0,-20 L 8,-6 L 3,-6 L 3,16 L -3,16 L -3,-6 L -8,-6 Z" fill="#64748B"/>
        </g>
      </g>
      <text x="25" y="115" style="font-family: sans-serif; font-size: 11px; fill: #64748B;">Misma orientación (sin giro)</text>
    </g>

    <!-- Option B (CORRECT OPTION: ROTATED 90° CLOCKWISE) -->
    <g transform="translate(255, 20)">
      <rect width="220" height="130" rx="10" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
      <circle cx="28" cy="28" r="14" fill="#DCFCE7"/>
      <text x="28" y="33" text-anchor="middle" class="opt-label" fill="#15803D">B</text>
      <!-- Cube with arrow pointing RIGHT (Rotated 90° clockwise) -->
      <g transform="translate(130, 65) scale(0.68)">
        <polygon points="0,-50 44,-25 0,0 -44,-25" fill="url(#topFace)" stroke="#94A3B8" stroke-width="1.5"/>
        <polygon points="-44,-25 0,0 0,50 -44,25" fill="url(#leftFace)" stroke="#64748B" stroke-width="1.5"/>
        <polygon points="0,0 44,-25 44,25 0,50" fill="url(#frontHighlight)" stroke="#86EFAC" stroke-width="1.5"/>
        <!-- Arrow rotated 90° to the RIGHT -->
        <g transform="translate(22, 12) skewY(-30) rotate(90) scale(0.8)">
          <path d="M 0,-20 L 8,-6 L 3,-6 L 3,16 L -3,16 L -3,-6 L -8,-6 Z" fill="#16A34A"/>
        </g>
      </g>
      <text x="25" y="115" style="font-family: sans-serif; font-size: 11px; font-weight: 600; fill: #15803D;">Gira 90° a la derecha</text>
    </g>

    <!-- Option C -->
    <g transform="translate(20, 165)">
      <rect width="220" height="135" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
      <circle cx="28" cy="28" r="14" fill="#E2E8F0"/>
      <text x="28" y="33" text-anchor="middle" class="opt-label">C</text>
      <!-- Cube with arrow pointing DOWN (Rotated 180°) -->
      <g transform="translate(130, 65) scale(0.68)">
        <polygon points="0,-50 44,-25 0,0 -44,-25" fill="url(#topFace)" stroke="#94A3B8" stroke-width="1.5"/>
        <polygon points="-44,-25 0,0 0,50 -44,25" fill="url(#leftFace)" stroke="#64748B" stroke-width="1.5"/>
        <polygon points="0,0 44,-25 44,25 0,50" fill="url(#frontHighlight)" stroke="#94A3B8" stroke-width="1.5"/>
        <!-- Arrow pointing DOWN -->
        <g transform="translate(22, 12) skewY(-30) rotate(180) scale(0.8)">
          <path d="M 0,-20 L 8,-6 L 3,-6 L 3,16 L -3,16 L -3,-6 L -8,-6 Z" fill="#64748B"/>
        </g>
      </g>
      <text x="25" y="118" style="font-family: sans-serif; font-size: 11px; fill: #64748B;">Gira 180° (apunta hacia abajo)</text>
    </g>

    <!-- Option D -->
    <g transform="translate(255, 165)">
      <rect width="220" height="135" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
      <circle cx="28" cy="28" r="14" fill="#E2E8F0"/>
      <text x="28" y="33" text-anchor="middle" class="opt-label">D</text>
      <!-- Cube with arrow pointing LEFT (Rotated 90° counter-clockwise) -->
      <g transform="translate(130, 65) scale(0.68)">
        <polygon points="0,-50 44,-25 0,0 -44,-25" fill="url(#topFace)" stroke="#94A3B8" stroke-width="1.5"/>
        <polygon points="-44,-25 0,0 0,50 -44,25" fill="url(#leftFace)" stroke="#64748B" stroke-width="1.5"/>
        <polygon points="0,0 44,-25 44,25 0,50" fill="url(#frontHighlight)" stroke="#94A3B8" stroke-width="1.5"/>
        <!-- Arrow pointing LEFT (270° or -90°) -->
        <g transform="translate(22, 12) skewY(-30) rotate(270) scale(0.8)">
          <path d="M 0,-20 L 8,-6 L 3,-6 L 3,16 L -3,16 L -3,-6 L -8,-6 Z" fill="#64748B"/>
        </g>
      </g>
      <text x="25" y="118" style="font-family: sans-serif; font-size: 11px; fill: #64748B;">Gira hacia la izquierda</text>
    </g>
  </g>
</svg>
